{% extends 'layout.html' %} {% block content %}
<div class="cheese-container">
    <form method="POST">
        <div style="text-align: center;">
            <input type="text" value="{% if name %}{{ name }}{% else %}{{ content[1] }}{% endif %}" placeholder="Cheese Name" name="cheese-name" style="text-align: center; font-size: x-large; margin-bottom: 1rem;" class="cheese-input" required autocomplete="off">
        </div>
        <label for="img_url">Enter Image URL: <span style="color: red; font-size: small;">(Use a transparent background)</span></label>
        <input value="{% if img_url %}{{ img_url }}{% else %}{{ content[3] }}{% endif %}" type="text" id="img_url" name="img_url" placeholder="https://example.com/image.jpg" class="cheese-input" style="width: 13%;" required autocomplete="off">
        <button type="submit" name="image-submit" class="btn-img" formnovalidate>Display Image</button>
        <div class="img-p-flex">
            {% if img_url %}
                <div class="image">
                    <img src="{{ img_url }}" alt="User provided image">
                </div>
            {% else %}
                <div class="image">
                    <img src="{{ content[3] }}" alt="User provided image">
                </div>
            {% endif %}

            <div>
                <textarea placeholder="Description Of The Cheese (Wikipedia is a good source)" name="description" rows="20" cols="75" class="cheese-input" required>{% if description %}{{ description }}{% else %}{{ content[2] }}{% endif %}</textarea><br>
                <input type="text" name="origin" placeholder="Where It Originates From" class="cheese-input origin" value="{% if origin %}{{ origin }}{% else %}{{ content[4]}}{% endif %}" required autocomplete="off">
            </div>
        </div>
        <div style="text-align: center;">
          <button type="submit" name="add" class="btn-submit" style="background-color: green;">Add</button>
          <button type="submit" name="reject" class="btn-submit" style="background-color: red;">Reject</button>
        </div>
    </form>
</div>
{% endblock %}
