{% extends 'layout.html' %} {% block content %}
<div class="container">
  {% for row in content %}
    <div class="card">
      <h1 class="card-name">{{ row[1] }}</h1>
      <p class="card-about">{{ row[2] }}</p>
      <a class="btn" href="dev2?suggestionID={{ row[0] }}">Read More</a>
      <img
        class="card-image"
        src="{{ row[3] }}"
        alt="Image of {{ row[1] }}."
      />
    </div>
  {% endfor %}
</div>
{% endblock %}
